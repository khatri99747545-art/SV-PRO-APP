name: Build SV Pro Studio Direct
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project
        run: |
          flutter create sv_app
          cd sv_app
          flutter pub add video_player gal flutter_tts

      - name: Inject Secure Flag
        run: |
          sed -i '/import io.flutter.embedding.android.FlutterActivity/a import android.os.Bundle\nimport android.view.WindowManager' sv_app/android/app/src/main/kotlin/**/MainActivity.kt || true
          sed -i '/class MainActivity/a \    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)\n    }' sv_app/android/app/src/main/kotlin/**/MainActivity.kt || true

      - name: Build Release APK
        run: |
          cd sv_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SV-Pro-Studio-APK
          path: sv_app/build/app/outputs/flutter-apk/app-release.apk
